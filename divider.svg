<svg xmlns="http://www.w3.org/2000/svg" width="840" height="22" viewBox="0 0 840 22" role="img" aria-labelledby="title desc">
<title id="title">divider</title>
<desc id="desc">Animated neon section divider.</desc>
<style>
text{font-family:'JetBrains Mono','Fira Code','Cascadia Code','SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;}
.p1{animation:p1 3.6s linear infinite}@keyframes p1{to{transform:translateX(1000px)}}.p2{animation:p2 5.2s linear infinite}@keyframes p2{to{transform:translateX(-960px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;}}
</style>
<defs><linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00F7FF" stop-opacity="0"/><stop offset="0.5" stop-color="#00F7FF" stop-opacity="1"/><stop offset="1" stop-color="#00F7FF" stop-opacity="0"/></linearGradient><linearGradient id="pulse2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF2BD6" stop-opacity="0"/><stop offset="0.5" stop-color="#FF2BD6" stop-opacity="0.9"/><stop offset="1" stop-color="#FF2BD6" stop-opacity="0"/></linearGradient></defs>
<rect x="20" y="10.5" width="800" height="1" fill="#00F7FF" fill-opacity="0.2"/>
<g class="p1"><rect x="-160" y="10" width="160" height="2" fill="url(#pulse)"/></g>
<g class="p2"><rect x="840" y="10" width="110" height="2" fill="url(#pulse2)"/></g>
<polygon points="12,11 17,6 22,11 17,16" fill="#00F7FF"/>
<polygon points="818,11 823,6 828,11 823,16" fill="#00F7FF"/>
<polygon points="414.0,11 420.0,5 426.0,11 420.0,17" fill="#05070D" stroke="#FF2BD6"/>
</svg>
